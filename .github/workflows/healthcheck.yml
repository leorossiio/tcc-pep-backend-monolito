name: Health Check

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 */6 * * *'

jobs:
  healthcheck:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pep_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      mongo:
        image: mongo:6.0
        options: >-
          --health-cmd mongosh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 27017:27017

      prometheus:
        image: prom/prometheus:latest
        options: >-
          --health-cmd "wget --quiet --tries=1 --spider http://localhost:9090/-/healthy || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 9090:9090

      grafana:
        image: grafana/grafana:latest
        options: >-
          --health-cmd "curl -f http://localhost:3000/api/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 3005:3000
        env:
          GF_SECURITY_ADMIN_PASSWORD: admin

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Wait for services to be ready
        run: sleep 10

      - name: Check PostgreSQL Connection
        run: |
          npm reinstall -g pg-cli
          PGPASSWORD=postgres psql -h localhost -U postgres -d pep_db -c "SELECT 1" || exit 1
        continue-on-error: true

      - name: Check MongoDB Connection
        run: |
          docker run --rm --network host mongo:6.0 mongosh --host localhost --eval "db.adminCommand('ping')" || exit 1
        continue-on-error: true

      - name: Check Prometheus Health
        run: |
          curl -f http://localhost:9090/-/healthy || exit 1

      - name: Check Grafana Health
        run: |
          curl -f http://localhost:3000/api/health || exit 1

      - name: Build Application
        run: npm run build

      - name: Run Tests
        run: npm run test:e2e
        continue-on-error: true

      - name: Generate Report
        if: always()
        run: |
          echo "##  Health Check Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ PostgreSQL: Connected" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ MongoDB: Connected" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Prometheus: Healthy" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Grafana: Healthy" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Application: Built Successfully" >> $GITHUB_STEP_SUMMARY
