version: '3.8'

services:
  postgres-pep:
    image: postgres:15-alpine
    container_name: db_postgres_monolito
    restart: always
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pep_network

  mongo-pep:
    image: mongo:6.0
    container_name: db_mongo_monolito
    restart: always
    env_file:
      - .env
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
    ports:
      - "${MONGO_PORT}:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - pep_network

  # --- INFRAESTRUTURA DE TESTES DE ESTRESSE ---

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus_pep
    restart: always
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--web.enable-remote-write-receiver'   # Necessário para receber métricas do K6
      - '--storage.tsdb.retention.time=7d'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - pep_network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana_pep
    restart: always
    ports:
      - "3005:3000" # Acessível em localhost:3005
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning  # datasource + dashboard provisionados
    depends_on:
      - prometheus
    networks:
      - pep_network

  k6:
    image: grafana/k6:latest
    container_name: k6_pep
    volumes:
      - ./k6-scripts:/scripts
    networks:
      - pep_network
    # O k6 não tem 'restart: always' e nem portas, pois nós vamos executá-lo manualmente.

volumes:
  postgres_data:
  mongo_data:
  prometheus_data:
  grafana_data:

networks:
  pep_network:
    driver: bridge