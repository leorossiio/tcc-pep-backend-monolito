services:
  app-monolito:
    build:
      context: .
      dockerfile: dockerfile
    container_name: app_nestjs_monolito
    restart: always
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - POSTGRES_HOST=postgres-pep
      - POSTGRES_PORT=5432
      - MONGO_HOST=mongo-pep
      - MONGO_PORT=27017
    ports:
      - "3000:3000"
    depends_on:
      - postgres-pep
      - mongo-pep
    networks:
      - pep_network
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G

  postgres-pep:
    image: postgres:15-alpine
    container_name: db_postgres_monolito
    restart: always
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    command: >
      postgres
      -c shared_buffers=256MB
      -c effective_cache_size=768MB
      -c max_connections=100
      -c work_mem=4MB
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/postgres:/docker-entrypoint-initdb.d
    networks:
      - pep_network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  mongo-pep:
    image: mongo:6.0
    container_name: db_mongo_monolito
    restart: always
    env_file:
      - .env
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
      - MONGO_INITDB_DATABASE=${MONGO_INITDB_DATABASE:-pep_nao_relacional}
    ports:
      - "${MONGO_PORT}:27017"
    volumes:
      - mongo_data:/data/db
      - ./migrations/mongo:/docker-entrypoint-initdb.d
    networks:
      - pep_network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus_pep
    restart: always
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--web.enable-remote-write-receiver'
      - '--storage.tsdb.retention.time=7d'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - pep_network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana_pep
    restart: always
    ports:
      - "3005:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      - GF_AUTH_LOGIN_COOKIE_NAME=grafana_session_monolito
      # Permite embutir dashboards via iframe no front (tela de benchmark)
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - pep_network

  # Fora do benchmark: sobe apenas com `docker compose --profile frontend up -d`
  # para não consumir o budget de recursos espelhado com o MS (4 CPU / 3G).
  frontend-pep:
    profiles: ["frontend"]
    build:
      context: ../tcc-pep-frontend
      dockerfile: Dockerfile
    container_name: frontend_pep
    restart: always
    ports:
      - "4200:80"
    depends_on:
      - app-monolito
    networks:
      - pep_network

  k6:
    image: grafana/k6:latest
    container_name: k6_pep
    environment:
      - K6_PROMETHEUS_RW_SERVER_URL=http://prometheus:9090/api/v1/write
      - K6_PROMETHEUS_RW_TREND_STATS=p(90),p(95),p(99),avg,min,med,max
    volumes:
      - ./k6-scripts:/scripts
    networks:
      - pep_network

volumes:
  postgres_data:
  mongo_data:
  prometheus_data:
  grafana_data:

networks:
  pep_network:
    driver: bridge