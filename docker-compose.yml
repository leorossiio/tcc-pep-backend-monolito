version: '3.8'

services:
  app-monolito:
    build:
      context: .
      dockerfile: dockerfile
    container_name: app_nestjs_monolito
    restart: always
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - POSTGRES_HOST=postgres-pep
      - POSTGRES_PORT=5432
      - MONGO_HOST=mongo-pep
      - MONGO_PORT=27017
    ports:
      - "3000:3000"
    depends_on:
      - postgres-pep
      - mongo-pep
    networks:
      - pep_network
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G

  postgres-pep:
    image: postgres:15-alpine
    container_name: db_postgres_monolito
    restart: always
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/postgres:/docker-entrypoint-initdb.d
    networks:
      - pep_network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  mongo-pep:
    image: mongo:6.0
    container_name: db_mongo_monolito
    restart: always
    env_file:
      - .env
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
      - MONGO_INITDB_DATABASE=${MONGO_INITDB_DATABASE:-pep_nao_relacional}
    ports:
      - "${MONGO_PORT}:27017"
    volumes:
      - mongo_data:/data/db
      - ./migrations/mongo:/docker-entrypoint-initdb.d
    networks:
      - pep_network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus_pep
    restart: always
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--web.enable-remote-write-receiver'
      - '--storage.tsdb.retention.time=7d'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - pep_network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana_pep
    restart: always
    ports:
      - "3005:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - pep_network

  k6:
    image: grafana/k6:latest
    container_name: k6_pep
    volumes:
      - ./k6-scripts:/scripts
    networks:
      - pep_network

volumes:
  postgres_data:
  mongo_data:
  prometheus_data:
  grafana_data:

networks:
  pep_network:
    driver: bridge